version: 1.0
runtime: python311
build:
  commands:
    build:
      # Use python3 -m pip to ensure the command is found
      - python3 -m pip install uv
      # Use --system to install into the App Runner environment
      - uv pip install --system .
run:
  command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8080
  # DO NOT add PORT to the env section; it is a reserved variable.
  # App Runner sets it automatically based on the 'network' section above.