services:
  postgres:
    image: postgres:15
    container_name: agendaai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agendaai
      POSTGRES_PASSWORD: agendaai
      POSTGRES_DB: agendaai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendaai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: agendaai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://agendaai:agendaai@postgres:5432/agendaai
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: ../mcp-servers
      dockerfile: agent/Dockerfile
    container_name: agendaai_agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ../mcp-servers/agent/.env
    environment:
      DATABASE_URL: postgresql+psycopg://agendaai:agendaai@postgres:5432/agendaai
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
