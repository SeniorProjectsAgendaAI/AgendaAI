version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Manually navigate into your frontend folder
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Tell Amplify the build folder is inside the frontend directory
    baseDirectory: frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*