[project]
name = "agenda-server"
version = "0.1.0"
description = "MCP server for AgendaAI internal task and event management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "mcp[cli]>=1.21.1",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
]

[project.scripts]
agenda-server = "main:main"
