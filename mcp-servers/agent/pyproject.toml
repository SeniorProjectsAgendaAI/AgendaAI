[project]
name = "agendaai-agent"
version = "0.1.0"
description = "Unified MCP agent that connects to Canvas, Gmail, and Google Calendar servers using Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-generativeai>=0.8.0",
  "mcp>=1.0.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "python-jose[cryptography]>=3.3.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "cryptography>=41.0.0",
]

[project.scripts]
agendaai-agent = "client:main"
