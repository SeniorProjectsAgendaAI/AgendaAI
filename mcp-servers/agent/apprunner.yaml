version: 1.0
runtime: python311
build:
  commands:
    build:
      - python3 -m pip install uv
      - uv pip install --system .
      # Pre-install MCP server virtualenvs
      - cd ../agenda-server && uv sync
      - cd ../gmail-server && uv sync
      - cd ../google-calendar-server && uv sync
      - cd ../canvas-server && uv sync
run:
  command: python3 -m uvicorn server:app --host 0.0.0.0 --port 8001
  network:
    port: 8001
  secrets:
    - name: GOOGLE_API_KEY
      value-from: "arn:aws:secretsmanager:us-east-2:004596742471:secret:AgendaAi/Production/GeminiKey-lxRqeD"
    - name: SECRET_KEY
      value-from: "arn:aws:secretsmanager:us-east-2:004596742471:secret:AgendaAi/Production/SecretKey-JfjD0N"
    - name: DATABASE_URL
      value-from: "arn:aws:secretsmanager:us-east-2:004596742471:secret:AgendaAi/Production/DatabaseURL-VgT3gn"
  env:
    - name: COGNITO_REGION
      value: "us-east-2"
    - name: COGNITO_USER_POOL_ID
      value: "us-east-2_CYhhE4hMo"
    - name: COGNITO_APP_CLIENT_ID
      value: "7iehhtb30ppjgbajvih1lksibo"
    - name: CORS_ALLOWED_ORIGINS
      value: "https://creating-dockerfile.d2i3jqbsdy4snq.amplifyapp.com"
